name: Repair weekend palette workflow

on:
  push:
    branches:
      - fix/native-subscription-settings

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-subscription-settings
          fetch-depth: 0

      - name: Repair one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          sed -i "/^[[:space:]]*if: github.actor !=/d" .github/workflows/apply-weekend-palette.yml
          sed -i 's/git commit -m "feat: add weekend overrides and configurable schedule colors"/git commit -m "feat: add weekend overrides and configurable schedule colors [skip ci]"/' .github/workflows/apply-weekend-palette.yml
          rm -f .github/workflows/fix-weekend-workflow.yml
          git config user.name "Jeff Li"
          git config user.email "laojianzi1994@gmail.com"
          git add -A
          git commit -m "chore: repair weekend palette workflow [skip ci]"
          git push origin HEAD:fix/native-subscription-settings
