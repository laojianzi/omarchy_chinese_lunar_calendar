name: Apply weekend policy and badge palette settings

on:
  push:
    branches:
      - fix/native-subscription-settings

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/native-subscription-settings
          fetch-depth: 0

      - name: Apply implementation
        run: python3 tools/apply-weekend-palette.py

      - name: Validate changes
        shell: bash
        run: |
          set -euo pipefail
          ./tests/run.sh
          python3 -m json.tool manifest.json >/dev/null
          grep -q '"version": "1.4.0"' manifest.json
          grep -q '"saturdayIsRest"' manifest.json
          grep -q '"restBadgeColor"' manifest.json
          grep -q 'weekendOverride' subscriptions/Projection.js
          grep -q 'PresentationSettings' components/DayCell.qml
          grep -q 'id: restBadgeColorField' Panel.qml
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply-weekend-palette.py
          rmdir tools 2>/dev/null || true
          git config user.name "Jeff Li"
          git config user.email "laojianzi1994@gmail.com"
          git add -A
          git commit -m "feat: add weekend overrides and configurable schedule colors"
          git push origin HEAD:fix/native-subscription-settings
